name: Publish Packages to Official Registries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # required for pub.dev OIDC publishing

jobs:
  # ─────────────────────────────────────────────
  # TypeScript → npm
  # ─────────────────────────────────────────────
  publish-npm:
    name: Publish to NPM (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies and Compile TypeScript
        run: |
          cd ts
          npm ci
          npm run build

      - name: Publish to NPM
        run: |
          cd ts
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────
  # Python → PyPI
  # ─────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python Distribution
        run: |
          cd python
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ─────────────────────────────────────────────
  # Dart → pub.dev
  # ─────────────────────────────────────────────
  publish-dart:
    name: Publish to pub.dev (Dart)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Dart Dependencies
        run: dart pub get
        working-directory: dart

      - name: Publish to pub.dev
        run: dart pub publish --force
        working-directory: dart

  # ─────────────────────────────────────────────
  # Kotlin → JitPack  (passive: auto-builds from tag)
  # PHP   → Packagist (passive: auto-updates from tag)
  # No CI steps needed — these registries watch GitHub tags automatically.
  # ─────────────────────────────────────────────
