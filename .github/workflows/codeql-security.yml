name: "Anti-Malware & Security CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight

jobs:
  analyze:
    name: Analyze Code for Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]
        # Note: Kotlin requires a compiled build, so we focus CodeQL on the primary dynamic languages here.
        # Dart/PHP are not officially supported natively by CodeQL but we run standard checks on TS and Python.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Initialize CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        # Enables extended security queries to catch logic flaws and injections
        queries: security-extended,security-and-quality

    # Automatically attempts to build the project if necessary (TS/JS don't need it)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    # Perform the analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{matrix.language}}"

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run NPM Audit (TS Workspace)
        working-directory: ./ts
        run: npm audit --audit-level=high

      - name: Run NPM Audit (Root)
        run: npm audit --audit-level=high || true
