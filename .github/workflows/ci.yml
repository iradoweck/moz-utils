name: Continuous Integration (CI)

on:
  push:
    branches: [ main, devlab ]
  pull_request:
    branches: [ main, devlab ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: ts/package.json

    - name: Install dependencies (TypeScript)
      run: npm install
      working-directory: ts

    - name: Compile TypeScript code
      run: npm run build
      working-directory: ts

    - name: Run validation tests (TypeScript)
      run: cd ts && npm test

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run validation tests (Python)
      run: python python/test_validation.py

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'

    - name: Run validation tests (PHP)
      run: php php/test-validation.php

    - name: Setup Dart
      uses: dart-lang/setup-dart@v1

    - name: Install dependencies (Dart)
      run: dart pub get
      working-directory: dart

    - name: Run validation tests (Dart)
      run: dart test
      working-directory: dart

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Run validation tests (Kotlin)
      run: gradle test
      working-directory: kotlin
