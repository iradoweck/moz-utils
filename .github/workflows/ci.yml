name: Integração Contínua (CI)

on:
  push:
    branches: [ main, devlab ]
  pull_request:
    branches: [ main, devlab ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Obter o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: ts/package.json

    - name: Instalar dependências (TypeScript)
      run: npm install
      working-directory: ts

    - name: Compilar o código TypeScript
      run: npm run build
      working-directory: ts

    - name: Executar testes de validação (TypeScript)
      run: node test-validation.js

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Executar testes de validação (Python)
      run: python python/test_validation.py

    - name: Configurar o PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'

    - name: Executar testes de validação (PHP)
      run: php php/test-validation.php

    - name: Configurar o Dart
      uses: dart-lang/setup-dart@v1

    - name: Instalar dependências (Dart)
      run: dart pub get
      working-directory: dart

    - name: Executar testes de validação (Dart)
      run: dart test
      working-directory: dart

    - name: Configurar o JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar o Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Executar testes de validação (Kotlin)
      run: gradle test
      working-directory: kotlin
