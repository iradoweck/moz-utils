name: Continuous Integration (CI)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, devlab ]
  pull_request:
    branches: [ main, devlab ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@main

    - name: Setup Node.js
      uses: actions/setup-node@main
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: ts/package.json

    - name: Install dependencies (TypeScript)
      run: npm install
      working-directory: ts

    - name: Compile TypeScript code
      run: npm run build
      working-directory: ts

    - name: Run validation tests (TypeScript)
      run: cd ts && npm test

    - name: Setup Python
      uses: actions/setup-python@main
      with:
        python-version: '3.12'

    - name: Install dependencies (Python)
      run: pip install -e .[dev]
      working-directory: python

    - name: Run validation tests (Python)
      run: pytest
      working-directory: python

    - name: Setup PHP
      uses: shivammathur/setup-php@main
      with:
        php-version: '8.4'

    - name: Install dependencies (PHP)
      run: composer install
      working-directory: php

    - name: Run validation tests (PHP)
      run: vendor/bin/phpunit tests/ValidationTest.php
      working-directory: php

    - name: Setup Dart
      uses: dart-lang/setup-dart@main

    - name: Install dependencies (Dart)
      run: dart pub get
      working-directory: dart

    - name: Run validation tests (Dart)
      run: dart test
      working-directory: dart

    - name: Setup JDK 21
      uses: actions/setup-java@main
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@main
      with:
        gradle-version: '8.14.4'

    - name: Run validation tests (Kotlin)
      run: gradle test
      working-directory: kotlin
