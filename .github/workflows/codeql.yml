name: "CodeQL Analysis"

on:
  push:
    branches: [ main, devlab ]
  pull_request:
    branches: [ main, devlab ]
  schedule:
    - cron: '30 18 * * 5'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python', 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    # Custom build setup for Java/Kotlin
    - name: Setup JDK 17
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      if: matrix.language == 'java-kotlin'
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Kotlin project for CodeQL Analysis
      if: matrix.language == 'java-kotlin'
      run: gradle build -x test
      working-directory: kotlin

    # Use autobuild for JS/TS and Python dynamic languages
    - name: Run Autobuild (Dynamic Languages)
      if: matrix.language != 'java-kotlin'
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
