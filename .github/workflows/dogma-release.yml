name: Dogmatic Base 10 Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@main
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: '24'

      - name: Run Base 10 Engine
        run: node .github/scripts/base10_release.js

      - name: Check for Changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes_exist=true" >> $GITHUB_OUTPUT

      - name: Create Release Pull Request
        if: steps.git-check.outputs.changes_exist == 'true'
        uses: peter-evans/create-pull-request@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): dogmatic base 10 version bump"
          title: "chore(release): Dogmatic Base 10 Evolution"
          body: |
            This PR was automatically generated by the Dogmatic Base 10 Release Engine.
            
            It contains version bumps and changelog updates respecting the Base 10 rules.
          branch: "release-dogma/auto"
          delete-branch: true
