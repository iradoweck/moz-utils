name: Deploy Website to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  schedule:
    - cron: '0 */12 * * *' # Correr de 12 em 12 horas para atualizar os stats
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
          
      - name: Install and Build moz-utils (TypeScript)
        run: |
          npm ci
          npm run build
        working-directory: ./ts
          
      - name: Install website dependencies
        run: npm ci
        working-directory: ./website
        
      - name: Fetch Insights Data
        run: |
          # Fetch GitHub Stats
          REPO_INFO=$(curl -s -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/iradoweck/moz-utils)
          STARS=$(echo "$REPO_INFO" | jq '.stargazers_count // 0')
          FORKS=$(echo "$REPO_INFO" | jq '.forks_count // 0')

          # Fetch NPM Downloads
          NPM_INFO=$(curl -s https://api.npmjs.org/downloads/point/last-month/moz-utils || echo '{"downloads": 0}')
          NPM_DL=$(echo "$NPM_INFO" | jq '.downloads // 0')

          # Packagist (PHP) Downloads
          PHP_INFO=$(curl -s https://packagist.org/packages/iradoweck/moz-utils.json || echo '{"package":{"downloads":{"total":0}}}')
          PHP_DL=$(echo "$PHP_INFO" | jq '.package.downloads.total // 0')

          # Python (PyPI) Downloads
          PY_INFO=$(curl -s https://pypistats.org/api/packages/moz-utils/recent || echo '{"data":{"last_month":0}}')
          PY_DL=$(echo "$PY_INFO" | jq '.data.last_month // 0')

          # Dart (pub.dev)
          DART_INFO=$(curl -s https://pub.dev/api/packages/moz_utils/metrics || echo '{"score":{"downloadCount30Days":0}}')
          DART_DL=$(echo "$DART_INFO" | jq '.score.downloadCount30Days // 0')

          # Fetch Top Contributors
          CONTRIBUTORS=$(curl -s -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/iradoweck/moz-utils/contributors?per_page=15" | \
            jq -c '[.[] | select(.type == "User") | {login: .login, avatar: .avatar_url, contributions: .contributions}] | .[0:10]')

          # Create stats.json
          cat <<EOF > website/public/stats.json
          {
            "downloads": {
              "ts": "$NPM_DL",
              "php": "$PHP_DL",
              "python": "$PY_DL",
              "dart": "$DART_DL"
            },
            "github": {
              "stars": "$STARS",
              "forks": "$FORKS"
            },
            "contributors": $CONTRIBUTORS
          }
          EOF

      - name: Build website
        run: npm run build
        working-directory: ./website
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './website/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
