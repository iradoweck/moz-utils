name: Deploy Website to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  schedule:
    - cron: '0 */12 * * *' # Correr de 12 em 12 horas para atualizar os stats
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        
      - name: Set up Node
        uses: actions/setup-node@main
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
          
      - name: Install and Build moz-utils (TypeScript)
        run: |
          npm ci
          npm run build
        working-directory: ./ts
          
      - name: Install website dependencies
        run: npm ci
        working-directory: ./website
        
      - name: Fetch Insights Data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GH_HEADERS="-H \"Accept: application/vnd.github.v3+json\" -H \"Authorization: token $GITHUB_TOKEN\""

          # Fetch GitHub Repo Stats
          REPO_INFO=$(curl -s -H "Accept: application/vnd.github.v3+json" -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/iradoweck/moz-utils || echo '{}')
          STARS=$(echo "$REPO_INFO" | jq '.stargazers_count // 0' || echo '0')
          FORKS=$(echo "$REPO_INFO" | jq '.forks_count // 0' || echo '0')
          OPEN_ISSUES=$(echo "$REPO_INFO" | jq '.open_issues_count // 0' || echo '0')
          LICENSE=$(echo "$REPO_INFO" | jq -r '.license.spdx_id // "N/A"' || echo 'N/A')
          LANG=$(echo "$REPO_INFO" | jq -r '.language // "N/A"' || echo 'N/A')

          # Fetch Open and Merged Pull Requests count
          OPEN_PRS=$(curl -s -H "Accept: application/vnd.github.v3+json" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/search/issues?q=repo:iradoweck/moz-utils+type:pr+state:open" | jq '.total_count // 0' || echo '0')
          MERGED_PRS=$(curl -s -H "Accept: application/vnd.github.v3+json" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/search/issues?q=repo:iradoweck/moz-utils+type:pr+is:merged" | jq '.total_count // 0' || echo '0')
          
          # Fetch Closed Issues count
          CLOSED_ISSUES=$(curl -s -H "Accept: application/vnd.github.v3+json" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/search/issues?q=repo:iradoweck/moz-utils+type:issue+state:closed" | jq '.total_count // 0' || echo '0')

          # Fetch Recent Commits (last 5)
          RECENT_COMMITS=$(curl -s -H "Accept: application/vnd.github.v3+json" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/iradoweck/moz-utils/commits?per_page=5" | \
            jq -c '[.[]? | {sha: (.sha // "")[0:7], message: ((.commit.message // "") | split("\n")[0]), author: .commit.author.name, date: .commit.author.date}]' || echo '[]')

          # Fetch NPM Downloads (last month)
          NPM_INFO=$(curl -s https://api.npmjs.org/downloads/point/last-month/moz-utils || echo '{"downloads": 0}')
          NPM_DL=$(echo "$NPM_INFO" | jq '.downloads // 0' || echo '0')

          # Fetch NPM Downloads weekly trend (last 8 weeks)
          NPM_TREND_RAW=$(curl -s "https://api.npmjs.org/downloads/range/last-8-weeks/moz-utils" || echo '{"downloads":[]}')
          NPM_TREND=$(echo "$NPM_TREND_RAW" | jq -c '[.downloads? // [] | .[]? | {week: .day, count: .downloads}]' || echo '[]')

          # Packagist (PHP) Downloads
          PHP_INFO=$(curl -s https://packagist.org/packages/iradoweck/moz-utils.json || echo '{"package":{"downloads":{"total":0}}}')
          PHP_DL=$(echo "$PHP_INFO" | jq '.package.downloads.total // 0' || echo '0')

          # Python (PyPI) Downloads
          PY_INFO=$(curl -s https://pypistats.org/api/packages/moz-utils/recent || echo '{"data":{"last_month":0}}')
          PY_DL=$(echo "$PY_INFO" | jq '.data.last_month // 0' || echo '0')

          # Dart (pub.dev)
          DART_INFO=$(curl -s https://pub.dev/api/packages/moz_utils/metrics || echo '{"score":{"downloadCount30Days":0}}')
          DART_DL=$(echo "$DART_INFO" | jq '.score.downloadCount30Days // 0' || echo '0')

          # Compute total downloads
          TOTAL_DL=$(echo "$NPM_DL + $PHP_DL + $PY_DL + $DART_DL" | bc || echo '0')

          # Fetch Top Contributors (humans only)
          CONTRIBUTORS=$(curl -s -H "Accept: application/vnd.github.v3+json" -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/iradoweck/moz-utils/contributors?per_page=15" | \
            jq -c '[.[]? | select(.type == "User") | {login: .login, avatar: .avatar_url, contributions: .contributions}] | .[0:10]' || echo '[]')

          # Check ecosystem health (HTTP status codes)
          NPM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://registry.npmjs.org/moz-utils/latest || echo '500')
          PYPI_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/moz-utils/json || echo '500')
          DART_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pub.dev/packages/moz_utils || echo '500')
          PHP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://packagist.org/packages/iradoweck/moz-utils || echo '500')

          NPM_HEALTHY=$( [ "$NPM_STATUS" = "200" ] && echo "true" || echo "false" )
          PYPI_HEALTHY=$( [ "$PYPI_STATUS" = "200" ] && echo "true" || echo "false" )
          DART_HEALTHY=$( [ "$DART_STATUS" = "200" ] && echo "true" || echo "false" )
          PHP_HEALTHY=$( [ "$PHP_STATUS" = "200" ] && echo "true" || echo "false" )

          # Build stats.json
          cat <<EOF > website/public/stats.json
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "downloads": {
              "ts": $NPM_DL,
              "php": $PHP_DL,
              "python": $PY_DL,
              "dart": $DART_DL,
              "total": $TOTAL_DL
            },
            "npm_trend": $NPM_TREND,
            "github": {
              "stars": $STARS,
              "forks": $FORKS,
              "open_issues": $OPEN_ISSUES,
              "closed_issues": $CLOSED_ISSUES,
              "open_prs": $OPEN_PRS,
              "merged_prs": $MERGED_PRS,
              "license": "$LICENSE",
              "primary_language": "$LANG"
            },
            "recent_commits": $RECENT_COMMITS,
            "contributors": $CONTRIBUTORS,
            "ecosystem": {
              "npm": {"name": "NPM", "registry": "npmjs.com", "healthy": $NPM_HEALTHY},
              "pypi": {"name": "PyPI", "registry": "pypi.org", "healthy": $PYPI_HEALTHY},
              "pub": {"name": "pub.dev", "registry": "pub.dev", "healthy": $DART_HEALTHY},
              "packagist": {"name": "Packagist", "registry": "packagist.org", "healthy": $PHP_HEALTHY}
            }
          }
          EOF



      - name: Build website
        run: npm run build
        working-directory: ./website
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './website/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
