name: "Enforce English Language (Internal Skill)"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-english:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Scan for Portuguese Keywords
        run: |
          echo "Scanning codebase for Portuguese keywords..."
          # Define common Portuguese programming words that shouldn't be in the English codebase
          # We use -i for case insensitivity. 
          # We exclude markdown, lock files, and this specific workflow to avoid false positives.
          
          PORTUGUESE_WORDS="função\|ficheiro\|variável\|variável\|usuário\|código\|teste\|validar\|validação\|erro\|sucesso\|retorna\|exemplo\|telefone\|cidade\|bairro\|província\|distrito"
          
          # Find files, ignoring node_modules, vendor, dist, build, and markdown/yaml docs
          FILES=$(find . -type f -not -path "*/node_modules/*" -not -path "*/vendor/*" -not -path "*/dist/*" -not -path "*/build/*" -not -path "*/.git/*" -not -name "*.md" -not -name "*.yml" -not -name "*.json" -not -name "*.lock" -not -name "*lock.json")
          
          FOUND_PT=false
          
          for FILE in $FILES; do
            # Grep for exact whole words (-w) to avoid matching parts of english words
            MATCHES=$(grep -i -w "$PORTUGUESE_WORDS" "$FILE" || true)
            if [ -n "$MATCHES" ]; then
              echo "::error file=$FILE::Found Portuguese keywords in $FILE! Please translate to English. Matches: $MATCHES"
              FOUND_PT=true
            fi
          done
          
          if [ "$FOUND_PT" = true ]; then
            echo "❌ Validation Failed! The repository must be entirely in English (Code, Docstrings, Variables)."
            exit 1
          else
            echo "✅ All code is clean and universally English!"
          fi
