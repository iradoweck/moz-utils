<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
      .logo-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 800;
        font-size: 64px;
        letter-spacing: -2px;
      }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon -->
  <g filter="url(#glow)" fill="none" stroke="#00ff88" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="25" y="25" width="50" height="50" rx="10"/>
    <rect x="40" y="40" width="20" height="20" rx="5"/>
    <line x1="34" y1="13" x2="34" y2="25"/>
    <line x1="50" y1="13" x2="50" y2="25"/>
    <line x1="66" y1="13" x2="66" y2="25"/>
    <line x1="34" y1="75" x2="34" y2="87"/>
    <line x1="50" y1="75" x2="50" y2="87"/>
    <line x1="66" y1="75" x2="66" y2="87"/>
    <line x1="13" y1="34" x2="25" y2="34"/>
    <line x1="13" y1="50" x2="25" y2="50"/>
    <line x1="13" y1="66" x2="25" y2="66"/>
    <line x1="75" y1="34" x2="87" y2="34"/>
    <line x1="75" y1="50" x2="87" y2="50"/>
    <line x1="75" y1="66" x2="87" y2="66"/>
  </g>
  
  <!-- Text -->
  <text x="115" y="72" class="logo-text">
    <tspan fill="#ffffff">moz</tspan><tspan fill="#00ff88">-utils</tspan>
  </text>
</svg>
