<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <!-- Icon without glow for light theme to look cleaner, or subtle glow -->
  <defs>
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow-light)" fill="none" stroke="#00d672" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="25" y="25" width="50" height="50" rx="10"/>
    <rect x="40" y="40" width="20" height="20" rx="5"/>
    <line x1="34" y1="13" x2="34" y2="25"/>
    <line x1="50" y1="13" x2="50" y2="25"/>
    <line x1="66" y1="13" x2="66" y2="25"/>
    <line x1="34" y1="75" x2="34" y2="87"/>
    <line x1="50" y1="75" x2="50" y2="87"/>
    <line x1="66" y1="75" x2="66" y2="87"/>
    <line x1="13" y1="34" x2="25" y2="34"/>
    <line x1="13" y1="50" x2="25" y2="50"/>
    <line x1="13" y1="66" x2="25" y2="66"/>
    <line x1="75" y1="34" x2="87" y2="34"/>
    <line x1="75" y1="50" x2="87" y2="50"/>
    <line x1="75" y1="66" x2="87" y2="66"/>
  </g>
  
  <!-- Text -->
  <text x="110" y="72" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-2">
    <tspan fill="#1a1a1a">moz</tspan><tspan fill="#00d672">-utils</tspan>
  </text>
</svg>
