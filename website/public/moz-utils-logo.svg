<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090a0f" stop-opacity="1"/>
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="flagClip">
      <rect x="336" y="368" width="120" height="80" rx="14"/>
    </clipPath>
  </defs>

  <!-- Base Dark Rounded Square -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#090a0f"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#00ff88" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Cpu Icon (Lucide style) -->
  <g stroke="#00ff88" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)">
    <rect x="136" y="136" width="240" height="240" rx="32"/>
    <rect x="196" y="196" width="120" height="120" rx="12"/>
    <path d="M216 96v40M296 96v40M216 376v40M296 376v40M96 216h40M96 296h40M376 216h40M376 296h40"/>
  </g>

  <!-- Mozambique Flag Badge (Bottom Right) -->
  <g clip-path="url(#flagClip)">
    <rect x="336" y="368" width="120" height="25" fill="#007168"/>
    <rect x="336" y="393" width="120" height="3" fill="#FFFFFF"/>
    <rect x="336" y="396" width="120" height="24" fill="#000000"/>
    <rect x="336" y="420" width="120" height="3" fill="#FFFFFF"/>
    <rect x="336" y="423" width="120" height="25" fill="#FCE100"/>
    <polygon points="336,368 388,408 336,448" fill="#D21034"/>
    <polygon points="353,397 356,405 364,405 358,410 360,418 353,413 346,418 348,410 342,405 350,405" fill="#FCE100"/>
  </g>
  <rect x="336" y="368" width="120" height="80" rx="14" stroke="#090a0f" stroke-width="6"/>
</svg>
