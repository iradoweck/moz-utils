[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moz_utils"
version = "0.1.0"
description = "Funções de utilidade para Moçambique — validação de NUIT, BI, documentos, e formatação de telefones."
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name="iradoweck" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
]
