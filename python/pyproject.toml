[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moz-utils"
version = "0.2.0"
description = "Utility functions for Mozambique — validation of NUIT, BI, documents, and phone number formatting."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.8"
keywords = ["mozambique", "nuit", "bi", "mzn", "metical", "provincia", "distritos", "mocambique", "telecom", "validation"]
authors = [
  { name="Edmilson Muacigarro", email="contacto@edmilsonmuacigarro.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://edmilsonmuacigarro.com"
Repository = "https://github.com/iradoweck/moz-utils.git"
"Bug Tracker" = "https://github.com/iradoweck/moz-utils/issues"
